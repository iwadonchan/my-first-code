<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎃 ハロウィン掲示板 - GitHub Issues BBS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 94, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(128, 0, 128, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 140, 0, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 蛍光浮遊ボタンの背景装飾 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(255, 140, 0, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 85% 85%, rgba(128, 0, 128, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 0, 0.05) 0%, transparent 30%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 20, 40, 0.95);
            border: 2px solid rgba(255, 140, 0, 0.3);
            border-radius: 20px;
            box-shadow:
                0 0 50px rgba(255, 140, 0, 0.2),
                0 0 100px rgba(128, 0, 128, 0.1),
                inset 0 0 30px rgba(255, 255, 0, 0.05);
            overflow: hidden;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
        }

        /* コンテナの蜘蛛の巣装飾 */
        .container::before {
            content: '🕸️';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 24px;
            opacity: 0.3;
            transform: rotate(15deg);
        }

        .container::after {
            content: '🕷️';
            position: absolute;
            bottom: 15px;
            left: 20px;
            font-size: 20px;
            opacity: 0.3;
            transform: rotate(-10deg);
        }

        .header {
            background:
                linear-gradient(135deg, #ff8c00 0%, #ff6b35 50%, #800080 100%),
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 10px,
                    rgba(255, 255, 255, 0.05) 10px,
                    rgba(255, 255, 255, 0.05) 20px
                );
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            border-bottom: 3px solid rgba(255, 255, 0, 0.3);
        }

        /* ヘッダーの骸骨装飾 */
        .header::before {
            content: '💀🎃👻';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            opacity: 0.4;
            letter-spacing: 10px;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
            position: relative;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
        }

        .header p {
            opacity: 0.95;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.6);
        }

        .actions {
            padding: 30px 20px;
            text-align: center;
        }

        .btn-primary {
            display: inline-block;
            background:
                linear-gradient(135deg, #ff8c00 0%, #ff6b35 50%, #ff4500 100%),
                radial-gradient(circle at 30% 30%, rgba(255, 255, 0, 0.3) 0%, transparent 50%);
            color: #fff;
            padding: 18px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow:
                0 8px 25px rgba(255, 140, 0, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 0, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .btn-primary:hover::before {
            opacity: 1;
            animation: shine 0.6s ease-in-out;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 12px 35px rgba(255, 140, 0, 0.6),
                0 0 30px rgba(255, 255, 0, 0.3);
        }

        .btn-secondary {
            display: inline-block;
            background:
                linear-gradient(135deg, #800080 0%, #9932cc 50%, #4b0082 100%),
                radial-gradient(circle at 70% 70%, rgba(128, 255, 0, 0.2) 0%, transparent 50%);
            color: #fff;
            padding: 18px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow:
                0 8px 25px rgba(128, 0, 128, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(128, 255, 0, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .btn-secondary::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(128, 255, 0, 0.2), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .btn-secondary:hover::before {
            opacity: 1;
            animation: purpleShine 0.6s ease-in-out;
        }

        @keyframes purpleShine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .btn-secondary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow:
                0 12px 35px rgba(128, 0, 128, 0.6),
                0 0 30px rgba(128, 255, 0, 0.3);
        }

        .posts-container {
            padding: 0 20px 30px;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #ffa500;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 140, 0, 0.2);
            border-top: 4px solid #ff8c00;
            border-radius: 50%;
            animation: halloweenSpin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
        }

        @keyframes halloweenSpin {
            0% {
                transform: rotate(0deg);
                box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
            }
            50% {
                box-shadow: 0 0 30px rgba(128, 0, 128, 0.6);
            }
            100% {
                transform: rotate(360deg);
                box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .post {
            background: rgba(40, 40, 60, 0.9);
            border: 1px solid rgba(255, 140, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.3),
                inset 0 0 15px rgba(255, 140, 0, 0.1);
            transition: all 0.4s ease;
            border-left: 4px solid #ff8c00;
            position: relative;
            overflow: hidden;
        }

        .post::before {
            content: '👻';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            opacity: 0.2;
            transform: rotate(15deg);
        }

        .post:hover {
            transform: translateY(-3px) translateX(5px) scale(1.02);
            box-shadow:
                0 10px 35px rgba(255, 140, 0, 0.4),
                0 0 30px rgba(128, 0, 128, 0.2),
                inset 0 0 20px rgba(255, 255, 0, 0.1);
            border-left-color: #ff4500;
            border-color: rgba(255, 255, 0, 0.4);
        }

        .post-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffa500;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .post-title a {
            color: inherit;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .post-title a:hover {
            color: #ffff00;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
        }

        .post-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #b8b8d0;
            background: rgba(20, 20, 40, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 140, 0, 0.2);
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .post-content {
            color: #d0d0e0;
            line-height: 1.7;
            margin-bottom: 20px;
            font-size: 1.05rem;
            background: rgba(25, 25, 45, 0.4);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 140, 0, 0.15);
        }

        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 140, 0, 0.3);
            background: rgba(30, 30, 50, 0.3);
            margin: 0 -25px -25px;
            padding: 20px 25px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        .post-number {
            background: linear-gradient(135deg, #ff8c00 0%, #ff6b35 100%);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            box-shadow: 0 3px 10px rgba(255, 140, 0, 0.4);
        }

        .post-link {
            color: #ffa500;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 15px;
            background: rgba(255, 140, 0, 0.1);
            border: 1px solid rgba(255, 140, 0, 0.3);
            transition: all 0.3s ease;
        }

        .post-link:hover {
            background: rgba(255, 140, 0, 0.2);
            border-color: rgba(255, 255, 0, 0.5);
            color: #ffff00;
            text-shadow: 0 0 8px rgba(255, 255, 0, 0.6);
            transform: scale(1.05);
        }

        .error {
            background: rgba(139, 0, 0, 0.2);
            border: 2px solid rgba(255, 0, 0, 0.4);
            color: #ff6b6b;
            padding: 25px;
            border-radius: 15px;
            margin: 20px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

        .error h3 {
            color: #ff4444;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .error a {
            color: #ff8c00;
            text-decoration: underline;
        }

        .error a:hover {
            color: #ffa500;
            text-shadow: 0 0 8px rgba(255, 140, 0, 0.6);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 25px 20px;
            background: rgba(30, 30, 50, 0.8);
            border: 2px solid rgba(255, 140, 0, 0.2);
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(128, 0, 128, 0.1);
        }

        .stat-item {
            text-align: center;
            position: relative;
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ff8c00;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .stat-label {
            color: #b8b8d0;
            font-size: 0.95rem;
            font-weight: 500;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* 統計アイコン */
        .stat-item::before {
            content: '🎃';
            display: block;
            font-size: 24px;
            margin-bottom: 5px;
            opacity: 0.6;
        }

        /* Mobile Responsive - Halloween Edition */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 2.2rem;
                margin-bottom: 12px;
            }

            .header p {
                font-size: 1.1rem;
            }

            .actions {
                padding: 25px 15px;
            }

            .btn-primary, .btn-secondary {
                display: block;
                margin: 12px auto;
                padding: 16px 30px;
                font-size: 1.1rem;
            }

            .post-meta {
                flex-direction: column;
                gap: 10px;
                font-size: 0.95rem;
            }

            .post-footer {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
                padding: 18px 20px;
            }

            .stats {
                flex-direction: column;
                gap: 20px;
                padding: 20px 15px;
            }

            .stat-item::before {
                font-size: 20px;
                margin-bottom: 3px;
            }

            .post {
                padding: 20px;
                margin-bottom: 18px;
            }

            .post-content {
                font-size: 1rem;
                padding: 12px;
            }

            .post-title {
                font-size: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px 12px;
            }

            .header h1 {
                font-size: 1.9rem;
            }

            .header p {
                font-size: 1rem;
            }

            .post {
                padding: 18px;
            }

            .post-title {
                font-size: 1.2rem;
            }

            .btn-primary, .btn-secondary {
                padding: 14px 25px;
                font-size: 1rem;
            }

            .container::before,
            .container::after {
                font-size: 16px;
            }

            .header::before {
                font-size: 16px;
                letter-spacing: 8px;
            }

            .stats {
                padding: 18px 12px;
                gap: 15px;
            }
        }

        /* Halloween Animation for Mobile */
        @media (hover: none) and (pointer: coarse) {
            .btn-primary:active,
            .btn-secondary:active {
                transform: scale(0.98);
            }

            .post:active {
                transform: scale(0.98);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎃 ハロウィン掲示板</h1>
            <p>👻 ゾンビと魔女が集うGitHub Issues掲示板 👻</p>
        </header>

        <div class="actions">
            <a href="https://github.com/iwadonchan/my-first-code/issues/new" target="_blank" class="btn-primary">
                🎃 新規投稿
            </a>
            <a href="https://github.com/iwadonchan/my-first-code/issues" target="_blank" class="btn-secondary">
                🧙‍♀️ すべての投稿
            </a>
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalPosts">0</div>
                <div class="stat-label">🎃 総投稿数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="openPosts">0</div>
                <div class="stat-label">👻 公開中</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="closedPosts">0</div>
                <div class="stat-label">💀 クローズ済み</div>
            </div>
        </div>

        <div class="posts-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>🧙‍♀️ 魔法の投稿を読み込中...</p>
            </div>
            <div id="posts"></div>
        </div>
    </div>

    <script>
        const config = {
            owner: 'iwadonchan',
            repo: 'my-first-code',
            maxPosts: 20
        };

        async function fetchGitHubIssues() {
            try {
                // GitHub APIを使用（CORS対策にjsonP風の回避策）
                const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/issues?state=all&sort=created&direction=desc&per_page=${config.maxPosts}`;

                const response = await fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'User-Agent': 'GitHub-BBS-App'
                    }
                });

                if (!response.ok) {
                    throw new Error(`GitHub APIエラー: ${response.status} - リポジトリが公開されているか確認してください`);
                }

                const issues = await response.json();
                return issues.filter(issue => !issue.pull_request);
            } catch (error) {
                console.error('Error fetching issues:', error);
                throw error;
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ja-JP', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function truncateContent(content, maxLength = 200) {
            if (content.length <= maxLength) return content;
            return content.substring(0, maxLength) + '...';
        }

        function createPostHTML(issue) {
            const createdAt = formatDate(issue.created_at);
            const updatedAt = formatDate(issue.updated_at);
            const truncatedContent = truncateContent(issue.body || '');

            return `
                <div class="post">
                    <h3 class="post-title">
                        <a href="${issue.html_url}" target="_blank">${issue.title}</a>
                    </h3>
                    <div class="post-meta">
                        <span>👤 ${issue.user.login}</span>
                        <span>📅 ${createdAt}</span>
                        <span>🏷️ ${issue.state === 'open' ? '公開中' : 'クローズ済み'}</span>
                        ${issue.comments > 0 ? `<span>💬 ${issue.comments} コメント</span>` : ''}
                    </div>
                    ${truncatedContent ? `<div class="post-content">${truncatedContent}</div>` : ''}
                    <div class="post-footer">
                        <span class="post-number">#${issue.number}</span>
                        <a href="${issue.html_url}" target="_blank" class="post-link">続きを読む →</a>
                    </div>
                </div>
            `;
        }

        function updateStats(issues) {
            const totalPosts = issues.length;
            const openPosts = issues.filter(issue => issue.state === 'open').length;
            const closedPosts = issues.filter(issue => issue.state === 'closed').length;

            document.getElementById('totalPosts').textContent = totalPosts;
            document.getElementById('openPosts').textContent = openPosts;
            document.getElementById('closedPosts').textContent = closedPosts;
        }

        async function displayPosts() {
            const loadingElement = document.getElementById('loading');
            const postsElement = document.getElementById('posts');

            try {
                const issues = await fetchGitHubIssues();

                loadingElement.style.display = 'none';

                if (issues.length === 0) {
                    postsElement.innerHTML = `
                        <div style="text-align: center; padding: 50px 20px; color: #ffa500;">
                            <h3>🎃 まだハロウィン投稿がありません</h3>
                            <p>👻 最初の恐怖の投稿を作成してみましょう！</p>
                        </div>
                    `;
                    return;
                }

                updateStats(issues);

                postsElement.innerHTML = issues.map(issue => createPostHTML(issue)).join('');

            } catch (error) {
                loadingElement.style.display = 'none';
                postsElement.innerHTML = `
                    <div class="error">
                        <h3>👻 魔法の呪文が失敗しました！</h3>
                        <p>${error.message}</p>
                        <p>🧙‍♀️ 魔女の確認リスト：</p>
                        <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                            <li>リポジトリ <a href="https://github.com/iwadonchan/my-first-code" target="_blank">iwadonchan/my-first-code</a> が存在する</li>
                            <li>リポジトリが公開（Public）になっている</li>
                            <li>Issuesが有効化されている</li>
                        </ul>
                        <p style="margin-top: 15px;">🎃 リポジトリが存在しない場合は、まず<a href="https://github.com/new" target="_blank">魔法のリポジトリを作成</a>してください。</p>
                    </div>
                `;
            }
        }

        // ページ読み込み時に投稿を表示
        document.addEventListener('DOMContentLoaded', displayPosts);

        // 5分ごとに自動更新
        setInterval(displayPosts, 5 * 60 * 1000);
    </script>
</body>
</html>
